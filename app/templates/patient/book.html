{% extends "base.html" %}

{% block title %}Book Appointment - CareSync{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        
        <!-- Navigation Breadcrumb link -->
        <div class="mb-3">
            <a href="{{ url_for('patient.dashboard') }}" class="text-dark small text-decoration-none">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>

        <!-- Booking Form Card (Pure Minimalist Bootstrap 5) -->
        <div class="card border border-secondary-subtle rounded-1 shadow-sm bg-white">
            <div class="card-header border-0 bg-transparent pt-4 pb-2 px-4 text-center">
                <h3 class="fw-bold text-dark fs-4 mb-1">Book Appointment</h3>
                <p class="text-muted small mb-0">Select your preferences below to reserve a timeslot</p>
            </div>
            
            <div class="card-body p-4 pt-2">
                <form action="{{ url_for('patient.book', doctor_id=preset_doctor_id, symptoms=preset_symptoms) }}" method="POST" class="needs-validation" novalidate>
                    
                    <div class="row g-2">
                        <!-- Select Doctor / Specialist -->
                        <div class="col-12 mb-1">
                            <label for="doctor_id" class="form-label text-secondary small mb-1" style="font-size: 0.75rem;">Specialist / Consultant *</label>
                            <select class="form-select form-select-sm border-secondary-subtle bg-white rounded-1" id="doctor_id" name="doctor_id" required>
                                <option value="" {% if not preset_doctor_id %}selected{% endif %} disabled>Choose a specialist...</option>
                                {% for doctor in doctors %}
                                    <option value="{{ doctor.id }}" {% if preset_doctor_id == doctor.id %}selected{% endif %}>
                                        Dr. {{ doctor.first_name }} {{ doctor.last_name }} ({{ doctor.specialization }}) — ₱{{ "%.2f"|format(doctor.consultation_fee) }}
                                    </option>
                                {% endfor %}
                            </select>
                            <div class="invalid-feedback">Please choose a doctor.</div>
                        </div>

                        <!-- Date Selection -->
                        <div class="col-12 mb-1">
                            <label for="appointment_date" class="form-label text-secondary small mb-1" style="font-size: 0.75rem;">Select Date *</label>
                            <input type="date" class="form-control form-control-sm border-secondary-subtle bg-white rounded-1" id="appointment_date" name="appointment_date" required>
                            <div class="invalid-feedback">Please choose a valid date.</div>
                        </div>

                        <!-- Time Selection -->
                        <div class="col-12 mb-1">
                            <label for="appointment_time" class="form-label text-secondary small mb-1" style="font-size: 0.75rem;">Select Time Slot *</label>
                            <select class="form-select form-select-sm border-secondary-subtle bg-white rounded-1" id="appointment_time" name="appointment_time" required>
                                <option value="" selected disabled>Choose clinic hour...</option>
                                <option value="09:00:00">09:00 AM</option>
                                <option value="10:00:00">10:00 AM</option>
                                <option value="11:00:00">11:00 AM</option>
                                <option value="13:00:00">01:00 PM</option>
                                <option value="14:00:00">02:00 PM</option>
                                <option value="15:00:00">03:00 PM</option>
                                <option value="16:00:00">04:00 PM</option>
                            </select>
                            <div class="invalid-feedback">Please choose a time slot.</div>
                        </div>

                        <!-- Short Symptoms brief description input -->
                        <div class="col-12 mb-3">
                            <label for="symptoms" class="form-label text-secondary small mb-1" style="font-size: 0.75rem;">Brief Reason for Visit (Optional)</label>
                            <textarea class="form-control border-secondary-subtle bg-white rounded-1 small" id="symptoms" name="symptoms" rows="3" placeholder="Describe symptoms or treatment briefly...">{{ preset_symptoms }}</textarea>
                        </div>
                    </div>

                    <!-- Booking submission -->
                    <div>
                        <button class="btn btn-dark btn-sm rounded-1 fw-bold py-2 text-uppercase w-100" type="submit">
                            Confirm Booking
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Native HTML Form Validation Handler
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
            
        // Prevent booking past dates
        const dateInput = document.getElementById('appointment_date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);
    })()
</script>
{% endblock %}
